name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          rm -rf www/www www/.git www/.github

      - name: Setup Capacitor and AdMob
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob
          npx cap init "Thumbnail Maker Pro" "com.thumbnailmaker.pro" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Inject AdMob App ID
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          app_id = "ca-app-pub-9929403853233838~1564317898"

          meta = f'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}" />'

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("</application>", f"    {meta}\n</application>")

          manifest.write_text(text)
          PY

      - name: Verify AdMob Configuration
        run: |
          echo "Checking AdMob App ID..."
          grep -n "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main/AndroidManifest.xml || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Thumbnail-Maker-Pro-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
